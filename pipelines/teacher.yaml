name: train-loop-teacher
description: Local conversation learning - teacher
type: pipeline
selector:
  match_labels:
    demo: demo-edge-training-loop
    role: training
config:
  input:
    http_server:
      address: 0.0.0.0:18110
      path: /transcript
      timeout: 300s
  pipeline:
    threads: 1
    processors:
      - log:
          level: INFO
          message: 'Teacher starting id=${! this.id }'
      - http:
          url: http://127.0.0.1:8025/grade
          verb: POST
          headers:
            Content-Type: application/json
          timeout: 240s
          retries: 10
          retry_period: 5s
      - log:
          level: INFO
          message: 'Teacher result id=${! this.id } error=${! error() }'
  output:
    reject_errored:
      http_client:
        url: http://127.0.0.1:8025/review
        verb: POST
        headers:
          Content-Type: application/json
        timeout: 300s
        retries: 10
        retry_period: 5s
