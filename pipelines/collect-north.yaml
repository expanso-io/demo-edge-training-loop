name: train-loop-collect-north
description: Local conversation learning - collect-north
type: pipeline
selector:
  match_labels:
    demo: demo-edge-training-loop
    role: site
    site: north
config:
  input:
    http_server:
      address: 127.0.0.1:18101
      path: /transcript
      timeout: 300s
  pipeline:
    processors:
      - label: log_transcript
        log:
          level: INFO
          message: 'Transcript received id=${! this.id } site=north'
  output:
    label: deliver_result
    reject_errored:
      http_client:
        url: http://127.0.0.1:18110/transcript
        verb: POST
        headers:
          Content-Type: application/json
        timeout: 300s
        retries: 10
        retry_period: 5s
