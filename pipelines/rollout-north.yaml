name: train-loop-rollout-north
description: Local conversation learning - rollout-north
type: pipeline
selector:
  match_labels:
    demo: demo-edge-training-loop
    role: site
    site: north
config:
  input:
    http_client:
      url: http://127.0.0.1:8025/bundle/north
      rate_limit: rollout_poll
      retries: 10
      retry_period: 5s
  rate_limit_resources:
    - label: rollout_poll
      local:
        count: 1
        interval: 5s
  pipeline:
    processors:
      - label: install_adapter
        http:
          url: http://127.0.0.1:8026/install
          verb: POST
          headers:
            Content-Type: application/json
          timeout: 120s
          retries: 10
          retry_period: 5s
      - label: log_release
        log:
          level: INFO
          message: 'Release site=north error=${! error() }'
  output:
    label: deliver_result
    reject_errored:
      http_client:
        url: http://127.0.0.1:8025/receipt
        verb: POST
        headers:
          Content-Type: application/json
        timeout: 300s
        retries: 10
        retry_period: 5s
